# Serve official Qwen/Qwen3.8-27B + the unmerged Jaffirt LoRA via vLLM.
# Run scripts/setup_serve.sh first (or `make setup`) so weights and the
# adapter exist on disk. Authorized sandbox demo only.

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:qwen38}
    container_name: jaffirt-vllm
    restart: unless-stopped
    ipc: host
    shm_size: "16gb"
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      - ${ADAPTER_DIR:-./models/adapter}:/adapters/jaffirt:ro
    command:
      - ${BASE_MODEL:-Qwen/Qwen3.8-27B}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${BASE_MODEL:-Qwen/Qwen3.8-27B}
      - --enable-lora
      - --lora-modules
      - jaffirt=/adapters/jaffirt
      - --max-loras
      - "1"
      - --max-lora-rank
      - "64"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-65536}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-1}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.90}"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_PARSER:-hermes}
      - --default-chat-template-kwargs
      - '{"enable_thinking": false}'
      - --trust-remote-code
      - --enforce-eager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
